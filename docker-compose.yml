services:
  # 1. DATABASE & VECTOR ENGINE: PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sentiment_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hackathon_password
      POSTGRES_DB: product_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. EVENT STREAMING LAYER: Native Apache Kafka (KRaft Mode - No Zookeeper Needed)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentiment_kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092'
      KAFKA_OFFERS_TO_REGISTER_AS_CONTROLLER: 'true'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Generates a static cluster ID required for KRaft initialization
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

volumes:
  pgdata:
